# Place in sites-available; enable after DNS points to the VPS.
# Obtain TLS certificate using certbot --nginx once port 80 is reachable.
server {
    listen 80;
    listen [::]:80;
    server_name rdp.bakunity.com;
    root /opt/bakunity-rdp-site/current;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /assets/ { add_header Cache-Control "public, max-age=3600"; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
